# Passtool macOS 构建流水线
# 在 GitHub Actions 上用新版 Xcode 编译，解决本地 Swift 5.1.3 过旧无法编译的问题。
# 产物为 x86_64 + arm64 通用二进制 .app，未签名（ad-hoc），可在 Intel/Apple Silicon Mac 上运行。

name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-mac:
    name: 构建 macOS 通用应用
    runs-on: macos-14
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 选择 Xcode 版本
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 查看可用 scheme
        run: xcodebuild -project Passtool.xcodeproj -list

      - name: 构建（通用二进制 x86_64 + arm64）
        run: |
          xcodebuild \
            -project Passtool.xcodeproj \
            -scheme PasstoolMac \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath build/Passtool.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_HARDENED_RUNTIME=NO \
            ARCHS="x86_64 arm64" \
            ONLY_ACTIVE_ARCH=NO \
            | xcpretty

      - name: 从 archive 导出未签名 .app
        run: |
          mkdir -p export
          cat > export/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>developer-id</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string></string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/Passtool.xcarchive \
            -exportPath export \
            -exportOptionsPlist export/ExportOptions.plist || true

      - name: 兜底：直接从 archive 取 .app
        run: |
          if [ ! -d "export/Passtool.app" ]; then
            echo "exportArchive 失败（无签名证书），改用 archive 内的 .app"
            APP=$(find build/Passtool.xcarchive/Products/Applications -name "*.app" | head -1)
            mkdir -p export
            cp -R "$APP" export/Passtool.app
          fi

      - name: 验证产物架构
        run: |
          echo "=== 二进制架构 ==="
          lipo -info export/Passtool.app/Contents/MacOS/Passtool
          echo "=== 应用内容 ==="
          ls -la export/Passtool.app/Contents/
          echo "=== 最小系统版本 ==="
          /usr/libexec/PlistBuddy -c "Print LSMinimumSystemVersion" export/Passtool.app/Contents/Info.plist 2>/dev/null || true

      - name: 打包 zip
        run: |
          cd export
          ditto -c -k --keepParent Passtool.app Passtool-mac-universal.zip
          ls -lh Passtool-mac-universal.zip

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Passtool-mac-universal
          path: export/Passtool-mac-universal.zip
          if-no-files-found: error

      - name: 发布 Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: export/Passtool-mac-universal.zip
          generate_release_notes: true

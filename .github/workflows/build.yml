# Passtool macOS 构建流水线
# 在 GitHub Actions 上用新版 Xcode 编译，解决本地 Swift 5.1.3 过旧无法编译的问题。
# 产物为 x86_64 + arm64 通用二进制 .app，未签名（ad-hoc），可在 Intel/Apple Silicon Mac 上运行。

name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-mac:
    name: 构建 macOS 通用应用
    runs-on: macos-15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 选择 Xcode 版本
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 查看可用 scheme
        run: xcodebuild -project Passtool.xcodeproj -list

      - name: 构建（通用二进制 x86_64 + arm64）
        run: |
          set -e
          xcodebuild \
            -project Passtool.xcodeproj \
            -scheme PasstoolMac \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath build/Passtool.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_HARDENED_RUNTIME=NO \
            ARCHS="x86_64 arm64" \
            ONLY_ACTIVE_ARCH=NO

      - name: 从 archive 提取 .app
        run: |
          set -e
          mkdir -p export
          APP=$(find build/Passtool.xcarchive/Products/Applications -name "*.app" | head -1)
          if [ -z "$APP" ]; then
            echo "❌ archive 中未找到 .app"
            exit 1
          fi
          cp -R "$APP" export/Passtool.app
          echo "✅ 已提取: $APP"

      - name: Ad-hoc 签名（无开发者证书，用本地签名消除 Gatekeeper 警告）
        run: |
          set -e
          codesign --force --deep --sign - export/Passtool.app
          echo "=== 签名验证 ==="
          codesign -dv export/Passtool.app 2>&1 | head -10

      - name: 验证产物架构
        run: |
          echo "=== 二进制架构 ==="
          lipo -info export/Passtool.app/Contents/MacOS/Passtool
          echo "=== 应用内容 ==="
          ls -la export/Passtool.app/Contents/
          echo "=== 最小系统版本 ==="
          /usr/libexec/PlistBuddy -c "Print LSMinimumSystemVersion" export/Passtool.app/Contents/Info.plist 2>/dev/null || true

      - name: 打包 zip（不保留扩展属性，避免下载后触发 Gatekeeper）
        run: |
          cd export
          ditto -c -k --keepParent --norsrc Passtool.app Passtool-mac-universal.zip
          ls -lh Passtool-mac-universal.zip

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Passtool-mac-universal
          path: export/Passtool-mac-universal.zip
          if-no-files-found: error

      - name: 发布 Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: export/Passtool-mac-universal.zip
          generate_release_notes: true
